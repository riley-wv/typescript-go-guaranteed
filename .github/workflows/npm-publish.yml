name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Semver prerelease suffix appended to internal/core/version.go, for example alpha.0 or dev.1'
        required: true
        type: string
      dist_tag:
        description: 'npm dist-tag to publish under'
        required: true
        default: 'next'
        type: string
      dry_run:
        description: 'Build packages and run npm publish --dry-run without publishing'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: ./.github/actions/setup-go

      - run: bun install --frozen-lockfile

      - name: Build npm tarballs
        run: bun run release:build --prerelease "${{ inputs.prerelease }}" --skipTests

      - name: Upload npm tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-packages-${{ inputs.prerelease }}
          path: |
            built/npm/*.tgz
            built/npm/publish-order.json

      - name: Dry-run npm publish
        if: ${{ inputs.dry_run }}
        run: bun run release:publish --dryRun --tag "${{ inputs.dist_tag }}"

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun run release:publish --tag "${{ inputs.dist_tag }}" --provenance
